[project]
name = "stock-pitch-engine"
version = "0.1.0"
description = "Generate analyst-style valuation models and pitch memos from SEC EDGAR data"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "typer>=0.12",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "streamlit>=1.36",
]

[project.scripts]
pitch = "pitch.cli:app"
pitch-ui = "pitch.ui:launch"

[dependency-groups]
dev = [
    "formulas>=1.3.4",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitch"]
